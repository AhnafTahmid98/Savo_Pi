# Robot Savo current fixed-sensor mount baseline.
# Values mirror robot_savo_sensors.xacro and robot_savo_costmap_frames.xacro.
# Confirm the physical offsets before the final autonomous-mapping tune.
metadata:
  profile: robot_savo_core_v1
  source: current_xacro_baseline
  final_physical_measurement_required: true
  units: metres_and_radians

mounts:
  lidar:
    frame: laser_frame
    parent: base_link
    xyz_m: [0.0, 0.0, 0.205]
    rpy_rad: [0.0, 0.0, 0.0]
  imu:
    frame: imu_link
    parent: base_link
    xyz_m: [0.0, 0.0, 0.075]
    rpy_rad: [0.0, 0.0, 0.0]
  camera:
    frame: camera_link
    parent: base_link
    xyz_m: [0.135, 0.0, 0.155]
    rpy_rad: [0.0, 0.0, 0.0]
  tof_left:
    frame: tof_left_link
    parent: base_link
    xyz_m: [0.125, 0.090, 0.070]
    rpy_rad: [0.0, 0.0, 0.0]
  tof_right:
    frame: tof_right_link
    parent: base_link
    xyz_m: [0.125, -0.090, 0.070]
    rpy_rad: [0.0, 0.0, 0.0]
  ultrasonic_front:
    frame: ultrasonic_front_link
    parent: base_link
    xyz_m: [0.150, 0.0, 0.070]
    rpy_rad: [0.0, 0.0, 0.0]
  display:
    frame: display_link
    parent: base_link
    xyz_m: [0.115, 0.0, 0.145]
    rpy_rad: [0.0, 0.0, 0.0]
  respeaker:
    frame: respeaker_link
    parent: base_link
    xyz_m: [0.0, 0.0, 0.180]
    rpy_rad: [0.0, 0.0, 0.0]
  depth_obstacle:
    frame: depth_obstacle_frame
    parent: base_link
    xyz_m: [0.135, 0.0, 0.155]
    rpy_rad: [0.0, 0.0, 0.0]
