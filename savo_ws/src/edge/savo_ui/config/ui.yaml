savo_ui_node:
  ros__parameters:
    robot_name: "SAVO"
    framebuffer_device: "/dev/fb0"
    touch_device: "/dev/input/by-path/platform-1f00088000.i2c-event"
    asset_root: ""
    preview_output_dir: "/tmp/savo_ui_preview"

    screen_width: 800
    screen_height: 480

    loop_hz: 10.0
    intro_seconds: 4.0
    robot360_seconds_per_frame: 4.0
    preview_animation_frames: 120

    enable_framebuffer: false
    enable_touch: false
    export_preview_frames: true
    # Read-only production ROS integration.
    mapping_state_topic: "/savo_mapping/autonomous/status"
    locations_state_topic: "/savo_locations/status"
    location_events_topic: "/savo_locations/events"
    bridge_state_topic: "/savo_bridge/state"
    bridge_readiness_topic: "/savo_bridge/readiness"
    speech_state_topic: "/savo_speech/state"
    speech_readiness_topic: "/savo_speech/readiness"
    playback_state_topic: "/savo_speech/playback/state"
    playback_finished_topic: "/savo_speech/playback/finished"
    transcript_topic: "/savo_speech/transcript"
    response_topic: "/savo_speech/response"
