/camera/camera:
  ros__parameters:
    camera_name: camera
    camera_namespace: camera

    serial_no: "801212070967"
    usb_port_id: ""
    device_type: ""

    enable_color: true
    enable_depth: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false

    depth_module.depth_profile: "848x480x15"
    rgb_camera.color_profile: "640x480x15"
    color_qos: SENSOR_DATA
    depth_qos: SENSOR_DATA

    align_depth.enable: true
    enable_sync: true

    # VO consumes aligned depth directly. Avoid pointcloud construction unless
    # the separately gated obstacle-cloud pipeline is requested.
    pointcloud__neon_.enable: false

    # Fixed camera TF is owned by savo_description/robot_state_publisher.
    publish_tf: false
    tf_publish_rate: 0.0

    initial_reset: false
    reconnect_timeout: 6.0
    wait_for_device_timeout: -1.0
