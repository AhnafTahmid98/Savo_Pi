savo_speech_node:
  ros__parameters:
    enabled: true

    profile: "edge_real_robot_v1"
    robot_id: "robot-savo"
    host_role: "edge"
    device_id: "savo-edge"

    audio:
      required: true

      # Stable ALSA PCM aliases. These must resolve to the ReSpeaker
      # through the edge host's ALSA configuration.
      capture_device: "savo_respeaker"
      playback_device: "savo_respeaker"

      # Numeric USB card indexes are intentionally forbidden because
      # ALSA card numbers can change after reboot or USB re-enumeration.
      allow_numeric_device_fallback: false

      require_exact_sample_rate: true
      sample_rate_hz: 16000

      # ReSpeaker USB capture exposes six interleaved channels.
      capture_channels: 6
      selected_channel: 0

      # SavoMind TTS playback is normalized to mono PCM.
      playback_channels: 1

      period_frames: 320
      periods: 4
      chunk_frames: 320

      pre_roll_ms: 1000
      post_playback_hold_ms: 250

      capture_queue_capacity_frames: 100
      playback_queue_capacity: 8

      processing:
        wait_timeout_ms: 100
        freshness_timeout_ms: 1000
        fault_on_processor_error: true

    wake_word:
      enabled: true
      required: true

      # Keep the safer phrase set for production. The extended profile
      # will be selected explicitly during PC alias testing.
      profile: "default"

      acoustic_model_path: "/usr/share/pocketsphinx/model/en-us/en-us"

      # Empty values select assets installed with the ROS package.
      dictionary_path: ""
      keyword_file_path: ""

      search_name: "savo_wake_words"
      suppress_decoder_log: true

      # PocketSphinx keyword-file thresholds perform the principal
      # phrase acceptance. This remains available for future backends.
      confidence_threshold: 0.65

      required_consecutive_detections: 1
      cooldown_ms: 2000
      event_queue_capacity: 8

    vad:
      enabled: true
      required: true

      backend:
        # Temporary production defaults. Final values will be tuned on
        # Raspberry Pi 5 using the ReSpeaker microphone array.
        startup_calibration_frames: 25

        initial_noise_floor_rms: 0.005
        minimum_noise_floor_rms: 0.0005
        maximum_noise_floor_rms: 0.250

        noise_floor_update_alpha: 0.05
        minimum_speech_rms: 0.010

        speech_onset_snr_db: 8.0
        speech_saturation_snr_db: 20.0

        clipping_threshold: 32760

      processor:
        # At 320 frames per 16 kHz capture period, each input frame is
        # approximately 20 ms.
        speech_start_threshold: 0.65
        speech_end_threshold: 0.35

        required_start_frames: 3
        required_end_frames: 10

        event_queue_capacity: 8

    utterance_session:
      enabled: true
      required: true

      # Temporary production defaults. Final values will be tuned
      # on Raspberry Pi 5 using the ReSpeaker microphone array.
      pre_roll_ms: 1000
      speech_start_timeout_ms: 10000
      maximum_duration_ms: 15000

      completed_queue_capacity: 4

    utterance_serialization:
      enabled: true
      required: true

      output_queue_capacity: 4
      source_wait_timeout_ms: 100

      # 2 MiB comfortably contains the configured 16 kHz mono
      # utterance limit while retaining a strict memory boundary.
      maximum_wav_bytes: 2097152

    savomind:
      enabled: true
      required: true
      socket_path: "/run/savomind/speech.sock"
      connect_timeout_ms: 1500
      io_timeout_ms: 120000
      source_wait_timeout_ms: 100
      playback_timeout_ms: 60000
      maximum_request_bytes: 2097152
      maximum_response_bytes: 16777216
      maximum_text_bytes: 8192
      # Production container runs as UID 10001; reject any other server process.
      require_server_uid: true
      server_uid: 10001

    diagnostics:
      status_publish_rate_hz: 2.0
      heartbeat_rate_hz: 1.0
