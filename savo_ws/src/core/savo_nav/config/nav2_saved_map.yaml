amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    robot_model_type: "nav2_amcl::OmniMotionModel"

    scan_topic: "/scan"

    min_particles: 500
    max_particles: 2000

    max_beams: 60

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: 12.0

    z_hit: 0.50
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.50

    sigma_hit: 0.20
    lambda_short: 0.10

    do_beamskip: false
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1
    transform_tolerance: 0.50

    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    pf_err: 0.05
    pf_z: 0.99

    save_pose_rate: 0.50
    tf_broadcast: true
    always_reset_initial_pose: false
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 5.0
    planner_plugins:
    - "GridBased"

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: "map"
      robot_base_frame: "base_footprint"

      # Conservative 0.330 x 0.240 m navigation envelope retained pending a
      # complete collision survey; intentionally larger than the measured plate.
      footprint: "[[0.165, 0.120], [0.165, -0.120], [-0.165, -0.120], [-0.165, 0.120]]"
      footprint_padding: 0.02

      resolution: 0.05
      track_unknown_space: true

      transform_tolerance: 0.50

      plugins:
      - "static_layer"
      - "obstacle_layer"
      - "inflation_layer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_min_range: 0.05
          obstacle_max_range: 6.0

          raytrace_min_range: 0.05
          raytrace_max_range: 8.0

          max_obstacle_height: 1.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 15.0
    costmap_update_timeout: 0.50

    odom_topic: "/odometry/filtered"
    odom_duration: 0.30

    enable_stamped_cmd_vel: false

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.30

    progress_checker_plugins:
    - "progress_checker"

    goal_checker_plugins:
    - "general_goal_checker"

    controller_plugins:
    - "FollowPath"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: -0.20
      min_vel_y: -0.20

      max_vel_x: 0.24
      max_vel_y: 0.24
      max_vel_theta: 0.55

      min_speed_xy: 0.0
      max_speed_xy: 0.24
      min_speed_theta: 0.0

      acc_lim_x: 0.50
      acc_lim_y: 0.50
      acc_lim_theta: 1.00

      decel_lim_x: -0.50
      decel_lim_y: -0.50
      decel_lim_theta: -1.00

      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 20

      sim_time: 1.50
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.30
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
      - "RotateToGoal"
      - "Oscillation"
      - "BaseObstacle"
      - "GoalAlign"
      - "PathAlign"
      - "PathDist"
      - "GoalDist"

      BaseObstacle.scale: 0.02

      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.10

      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.10

      PathDist.scale: 24.0
      GoalDist.scale: 18.0

      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: "odom"
      robot_base_frame: "base_footprint"

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      # Conservative production envelope; do not replace with plate-only bounds.
      footprint: "[[0.165, 0.120], [0.165, -0.120], [-0.165, -0.120], [-0.165, 0.120]]"
      footprint_padding: 0.02

      transform_tolerance: 0.30

      plugins:
      - "obstacle_layer"
      - "inflation_layer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_min_range: 0.05
          obstacle_max_range: 4.0

          raytrace_min_range: 0.05
          raytrace_max_range: 6.0

          max_obstacle_height: 1.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: false

    local_costmap_topic: "local_costmap/costmap_raw"
    global_costmap_topic: "global_costmap/costmap_raw"

    local_footprint_topic: "local_costmap/published_footprint"
    global_footprint_topic: "global_costmap/published_footprint"

    cycle_frequency: 10.0

    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_footprint"

    transform_tolerance: 0.30

    enable_stamped_cmd_vel: false

    simulate_ahead_time: 2.0

    max_rotational_vel: 0.55
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.00

    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odometry/filtered"

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    - wait_error_code
waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 10
    stop_on_failure: true

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false

    autostart: false
    bond_timeout: 4.0

    node_names:
    - "map_server"
    - "amcl"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false

    autostart: false
    bond_timeout: 4.0

    node_names:
    - "controller_server"
    - "planner_server"
    - "behavior_server"
    - "bt_navigator"
    - "waypoint_follower"
