costmap_sensors:
  integration_status: stationary_d435_voxel_acceptance_complete_production_gated

  lidar:
    topic: /scan
    message_type: sensor_msgs/msg/LaserScan
    required_for_navigation: true
    global_costmap: true
    local_costmap: true
    marking: true
    clearing: true
    inf_is_valid: true
    publisher_verified: true
    publisher_source: savo_lidar/src/ros/scan_publisher.cpp
    infinity_evidence: >-
      savo_lidar/src/drivers/rplidar_driver.cpp converts invalid or
      out-of-range measurements to positive infinity.

  realsense:
    filtered_topic: /savo_perception/obstacles/points
    raw_topic: /camera/camera/depth/color/points
    message_type: sensor_msgs/msg/PointCloud2
    required_for_navigation: false
    global_costmap: false
    local_costmap: true
    layer: voxel
    marking: true
    clearing: false
    producer_implemented: true
    producer_contract_verified: true
    producer_stationary_hardware_accepted: true
    stationary_voxel_hardware_accepted: true
    stationary_hardware_acceptance_date: '2026-08-26'
    producer_hardware_validated: false
    producer_source: savo_perception/src/nodes/obstacle_cloud_filter_node.cpp
    raw_topic_allowed_in_nav2: false
    activation_gate: complete_floor_scene_motion_and_stability_validation
    evidence: >-
      Stationary Real D435 parser, frame, timestamp, freshness, stale-expiry,
      recovery, Edge-to-Core DDS, and isolated local-voxel marking acceptance
      passed on 2026-08-26. Full floor, self-filter, obstacle-scene,
      moving-navigation, and stability validation is still required before
      activation. Clearing remains false because the filtered cloud has
      obstacle-only semantics; LiDAR owns reliable free-space clearing.

  ownership:
    sensor_production: false
    control_mode: false
    recovery_execution: false
    velocity: false
    hardware: false
