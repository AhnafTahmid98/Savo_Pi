saved_map_profile:
  profile_version: 1
  mode: saved_map
  map_to_odom_authority: amcl
  odom_to_base_footprint_authority: savo_localization
  map_frame: map
  odom_frame: odom
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  map_topic: /map
  scan_topic: /scan
  odometry_topic: /odometry/filtered
  nav2_action: /navigate_to_pose
  nav2_velocity_output: /cmd_vel_nav
  controller: dwb_holonomic
  amcl_motion_model: omnidirectional
  local_costmap_mode: lidar_2d_baseline
  filtered_pointcloud_enabled: false
  voxel_layer_enabled: false
  lifecycle_autostart: false
  goal_gateway_enabled: true
  hardware_test_enabled: false
  provisional_robot_radius_m: 0.22
  notes:
  - Robot dimensions must be measured before hardware activation.
  - RealSense VoxelLayer is mandatory in the later real profile.
  - Supervisor authority integration is not enabled in Phase 5.
  navigation_action: /savo_nav/navigation/navigate_to_pose
  exploration_action: /savo_nav/exploration/navigate_to_pose
  internal_nav2_action: /navigate_to_pose
  behavior_tree_override_enabled: false
