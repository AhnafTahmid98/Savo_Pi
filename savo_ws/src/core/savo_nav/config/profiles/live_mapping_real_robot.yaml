live_mapping_real_robot_profile:
  profile_version: 1
  mode: live_mapping
  map_to_odom_authority: slam_toolbox
  odom_to_base_footprint_authority: savo_localization
  map_frame: map
  odom_frame: odom
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  map_topic: /map
  scan_topic: /scan
  odometry_topic: /odometry/filtered
  nav2_action: /navigate_to_pose
  nav2_velocity_output: /cmd_vel_nav
  controller: dwb_holonomic
  local_costmap_mode: lidar_2d_guarded_baseline
  lifecycle_autostart: true
  goal_gateway_enabled: true
  goal_admission_gate_enabled: true
  control_recovery_guard_enabled: true
  lidar_required_for_navigation: true
  realsense_required_for_navigation: false
  filtered_pointcloud_enabled: false
  voxel_layer_enabled: false
  hardware_test_enabled: true
  direct_velocity_authority: false
  notes:
    - SLAM Toolbox must already own map to odom.
    - AMCL and map_server must not run in this mode.
    - The RealSense voxel layer remains disabled until guarded D435 validation.
    - Final robot footprint dimensions require physical measurement.
