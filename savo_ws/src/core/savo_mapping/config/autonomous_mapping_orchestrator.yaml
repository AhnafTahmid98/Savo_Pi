autonomous_mapping_orchestrator_node:
  ros__parameters:
    use_sim_time: false

    action_name: "/savo_mapping/autonomous/run"
    control_service: "/savo_mapping/autonomous/control"
    supervisor_authorization_service: "/savo_supervisor/authorize_operation"
    supervisor_authority_check_period_s: 0.5
    supervisor_authority_stale_timeout_s: 1.5
    status_topic: "/savo_mapping/autonomous/status"

    mode_topic: "/savo_mapping/mode"
    exploration_mode_topic: "/savo_mapping/exploration_mode"
    workflow_phase_topic: "/savo_mapping/workflow_phase"
    session_state_topic: "/savo_mapping/session_state"
    readiness_topic: "/savo_mapping/readiness"
    safety_stop_topic: "/safety/stop"
    runtime_authority_topic: "/savo_mapping/exploration/runtime_enabled"
    handoff_state_topic: "/savo_mapping/exploration_goal/state"
    frontier_status_topic: "/savo_mapping/frontier_explorer/typed_status"

    mode_command_topic: "/savo_mapping/mode_cmd"
    start_session_command_topic: "/savo_mapping/start_session_cmd"
    cancel_session_command_topic: "/savo_mapping/cancel_session_cmd"
    handoff_cancel_service: "/savo_mapping/exploration_goal/cancel"

    sequence:
      require_start_pose_capture: true
      require_initial_scan360: true
      require_initial_head_scan: true
      start_pose_target_frame: "map"
      start_pose_source_frame: "base_link"
      start_pose_lookup_timeout_s: 0.20
      start_pose_stale_timeout_s: 1.0
      start_pose_operation_timeout_s: 10.0
      scan360_state_topic: "/savo_mapping/scan360/state"
      scan360_start_service: "/savo_mapping/scan360/start"
      scan360_cancel_service: "/savo_mapping/scan360/cancel"
      scan360_operation_timeout_s: 180.0
      scan360_cancel_timeout_s: 10.0
      head_scan_state_topic: "/savo_head/scan_state"
      head_scan_start_service: "/savo_head/start_scan"
      head_scan_pause_service: "/savo_head/pause_scan"
      head_scan_resume_service: "/savo_head/resume_scan"
      head_scan_operation_timeout_s: 180.0
      head_scan_quiescence_timeout_s: 10.0

    coverage:
      enabled: true
      required: true
      request_plan_service: "/savo_mapping/coverage/request_plan"
      reset_plan_service: "/savo_mapping/coverage/reset_plan"
      planner_status_topic: "/savo_mapping/coverage/status"
      operation_approve_service: "/savo_mapping/coverage_operation/approve"
      operation_cancel_service: "/savo_mapping/coverage_operation/cancel"
      operation_reset_service: "/savo_mapping/coverage_operation/reset"
      operation_status_topic: "/savo_mapping/coverage_operation/status"
      planning_timeout_s: 30.0
      approval_timeout_s: 10.0
      execution_timeout_s: 900.0
      feedback_stale_timeout_s: 5.0
      cancel_timeout_s: 10.0
      proximity_timeout_s: 3.0
      proximity_poll_period_s: 0.10
      maximum_restart_attempts: 2
      require_fresh_map_generation: true

    return_to_start:
      enabled: true
      action_name: "/savo_nav/navigation/navigate_to_pose"
      server_wait_timeout_s: 3.0
      goal_response_timeout_s: 3.0
      execution_timeout_s: 180.0
      feedback_stale_timeout_s: 5.0
      cancel_timeout_s: 10.0
      position_tolerance_m: 0.35
      require_yaw_tolerance: false
      yaw_tolerance_rad: 0.50
      maximum_attempts: 2

    final_sequence:
      require_final_scan360: true
      require_final_head_scan: true

    save:
      map_session_service: "/savo_mapping/map_session/save"
      operation_timeout_s: 45.0
      expected_frame: "map"

    release:
      review_service: "/savo_mapping/autonomous/review_release"
      active_joint_release_topic: "/savo_mapping/joint_active_release"
      location_candidates_service: "/savo_locations/candidates/list"
      location_list_service: "/savo_locations/list"
      location_prepare_service: "/savo_locations/releases/prepare"
      location_verify_service: "/savo_locations/releases/verify"
      location_commit_service: "/savo_locations/releases/commit"
      location_rollback_service: "/savo_locations/releases/rollback"
      production_map_root: "/var/lib/robot_savo/maps/production"
      journal_root: "/var/lib/robot_savo/maps/release_transactions"
      geometry_profile_id: "robot_savo_core_v1"
      require_locked_geometry: true
      allow_provisional_geometry: false
      require_approved_location: false
      location_verification_timeout_s: 15.0
      operator_approval_timeout_s: 600.0
      location_prepare_timeout_s: 30.0
      map_creation_verification_timeout_s: 60.0
      location_commit_timeout_s: 30.0
      map_promotion_timeout_s: 30.0
      rollback_recovery_timeout_s: 60.0

    evaluation_period_ms: 250
    command_retry_period_ms: 1000

    # Zero disables the mission-level timeout.
    default_mission_timeout_s: 0.0

    completion:
      minimum_exhaustion_observations: 3
      minimum_stable_duration_s: 5.0
      frontier_status_timeout_s: 3.0
      allow_no_frontiers: true
      allow_no_reachable_frontiers: true
      allow_no_selectable_frontier: false
