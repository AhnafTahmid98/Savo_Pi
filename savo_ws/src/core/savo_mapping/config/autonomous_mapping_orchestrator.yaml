autonomous_mapping_orchestrator_node:
  ros__parameters:
    use_sim_time: false

    action_name: "/savo_mapping/autonomous/run"
    control_service: "/savo_mapping/autonomous/control"
    status_topic: "/savo_mapping/autonomous/status"

    mode_topic: "/savo_mapping/mode"
    exploration_mode_topic: "/savo_mapping/exploration_mode"
    workflow_phase_topic: "/savo_mapping/workflow_phase"
    session_state_topic: "/savo_mapping/session_state"
    readiness_topic: "/savo_mapping/readiness"
    safety_stop_topic: "/safety/stop"
    runtime_authority_topic: "/savo_mapping/exploration/runtime_enabled"
    handoff_state_topic: "/savo_mapping/exploration_goal/state"
    frontier_status_topic: "/savo_mapping/frontier_explorer/typed_status"

    mode_command_topic: "/savo_mapping/mode_cmd"
    start_session_command_topic: "/savo_mapping/start_session_cmd"
    cancel_session_command_topic: "/savo_mapping/cancel_session_cmd"
    handoff_cancel_service: "/savo_mapping/exploration_goal/cancel"

    sequence:
      require_start_pose_capture: true
      require_initial_scan360: true
      require_initial_head_scan: true
      start_pose_target_frame: "map"
      start_pose_source_frame: "base_link"
      start_pose_lookup_timeout_s: 0.20
      start_pose_stale_timeout_s: 1.0
      start_pose_operation_timeout_s: 10.0
      scan360_state_topic: "/savo_mapping/scan360/state"
      scan360_start_service: "/savo_mapping/scan360/start"
      scan360_cancel_service: "/savo_mapping/scan360/cancel"
      scan360_operation_timeout_s: 180.0
      head_scan_state_topic: "/savo_head/scan_state"
      head_scan_start_service: "/savo_head/start_scan"
      head_scan_pause_service: "/savo_head/pause_scan"
      head_scan_resume_service: "/savo_head/resume_scan"
      head_scan_operation_timeout_s: 180.0

    save:
      map_session_service: "/savo_mapping/map_session/save"
      operation_timeout_s: 45.0
      expected_frame: "map"

    evaluation_period_ms: 250
    command_retry_period_ms: 1000

    # Zero disables the mission-level timeout.
    default_mission_timeout_s: 0.0

    completion:
      minimum_exhaustion_observations: 3
      minimum_stable_duration_s: 5.0
      frontier_status_timeout_s: 3.0
      allow_no_frontiers: true
      allow_no_reachable_frontiers: true
      allow_no_selectable_frontier: false
