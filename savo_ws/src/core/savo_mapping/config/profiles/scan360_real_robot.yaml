scan360_mapper_node:
  ros__parameters:
    # Loading the real-robot profile alone never starts rotation.
    auto_start: false

    # Conservative starting values for guarded Pi testing. Final physical
    # tuning must be performed on the robot under the normal safety gates.
    yaw_stale_timeout_sec: 0.5
    settle_duration_sec: 1.0
    rotation_max_duration_sec: 12.0
    server_wait_timeout_sec: 2.0
    goal_response_timeout_sec: 2.0
    feedback_stale_timeout_sec: 2.0
    cancel_timeout_sec: 3.0
    execution_grace_timeout_sec: 1.5
