coverage_mapper_node:
  ros__parameters:
    # Loading the real-robot profile never authorizes automatic planning.
    auto_plan: false
    plan_once: true
    allow_unknown: false

    # Retained guarded legacy clearance; it is not derived from the current
    # rectangular Nav2 collision envelope. Final inflation, lane spacing,
    # timing, and freshness values require Pi and floor validation.
    inflation_radius_m: 0.24
    map_stale_timeout_sec: 2.0
    tf_stale_timeout_sec: 0.5
