schema_version: 1

storage:
  database_path: /var/lib/robot_savo/locations/locations.db
  backup_directory: /var/lib/robot_savo/locations/backups

  authoritative_runtime_store: sqlite
  create_parent_directories: true

  journal_mode: WAL
  synchronous: NORMAL
  foreign_keys: true
  busy_timeout_ms: 5000
  temporary_store: MEMORY

  migrate_on_startup: true
  fail_on_newer_schema: true
  integrity_check_on_startup: true
  fail_closed_on_integrity_error: true

runtime_permissions:
  directory_mode: "0750"
  database_mode: "0640"

testing:
  use_tmp_directory: false
  file_database_root: build/savo_locations/storage_test_runtime
  in_memory_database_allowed: true
snapshot_persistence:
  typed_domain_records: true
  validate_before_write: true
  validate_after_read: true

  write_mode: atomic_replace
  transaction_begin_mode: IMMEDIATE

  preserve_event_journal: true
  replace_locations: true
  replace_candidates: true

  reject_identity_conflicts: true
  reject_tag_conflicts: true
  reject_missing_approved_location: true
  reject_corrupt_loaded_records: true
