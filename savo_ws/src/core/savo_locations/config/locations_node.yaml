savo_locations:
  ros__parameters:
    # SQLite is the production authority. The parent directory must be
    # provisioned with ownership for the robot runtime user.
    database_path: /var/lib/robot_savo/locations/locations.db
    releases_root: /var/lib/robot_savo/locations/releases

    # Production startup may apply supported forward migrations.
    auto_migrate: true

    # System deployment should create /var/lib/robot_savo/locations.
    # Keep this false so the node does not silently alter permissions.
    create_parent_directories: false

    status_publish_hz: 1.0
    heartbeat_publish_hz: 2.0

    # Expose persistent candidate registration, approval, rejection and
    # enable/disable services. Set false for maintenance read-only mode.
    enable_write_services: true

    # Transient-local JSON diagnostic snapshot. Typed access remains
    # available through the location and candidate read services plus
    # the persistent write service contracts.
    publish_snapshot: true


# Fail-closed recovery is explicit. When a write transaction reports a
# storage failure, write_ready remains false until an operator calls:
#   /savo_locations/storage/recover
# Recovery opens and validates a fresh SQLite connection before the
# active repository is replaced. Read services keep the last committed
# in-memory catalog while write readiness is degraded.
