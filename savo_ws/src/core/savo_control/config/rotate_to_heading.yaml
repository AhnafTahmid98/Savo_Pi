rotate_to_heading_node:
  ros__parameters:
    publish_hz: 30.0
    input_timeout_s: 0.40

    enabled: true
    start_on_target: true
    auto_disable_when_goal_reached: true
    safety_stop_blocks_motion: true
    publish_zero_when_inactive: true

    target_tolerance_rad: 0.06
    max_duration_s: 8.0

    kp: 0.80
    ki: 0.0
    kd: 0.03

    max_wz_rad_s: 0.35
    min_wz_when_active: 0.08
    disable_min_wz_below_error_rad: 0.08
    output_deadband_rad_s: 0.0

    min_dt_sec: 0.001
    max_dt_sec: 0.20

    odom_topic: "/odometry/filtered"
    target_topic: "/savo_control/rotate_target_rad"
    enable_topic: "/savo_control/rotate_enable"
    cancel_topic: "/savo_control/rotate_cancel"
    safety_stop_topic: "/safety/stop"

    # Normal requested rotation uses the AUTO lane.
    # Recovery behavior remains on /cmd_vel_recovery.
    output_topic: "/cmd_vel_auto"

    state_topic: "/savo_control/rotate_state"
    status_topic: "/savo_control/rotate_status"
