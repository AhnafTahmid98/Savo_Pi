localization_health_node:
  ros__parameters:
    publish_rate_hz: 2.0

    imu_state_topic: /savo_localization/imu_state

    wheel_odom_state_topic: /savo_localization/wheel_odom_state

    filtered_odom_topic: /odometry/filtered
    diagnostics_topic: /diagnostics

    health_topic: /savo_localization/health
    state_summary_topic: /savo_localization/state_summary

    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link

    use_imu: true
    use_wheel_odom: true
    use_ekf: true
    use_vo: false

    require_odom_to_base_tf: true
    require_base_to_imu_tf: true

    expected_imu_rate_hz: 25.0
    expected_wheel_odom_rate_hz: 30.0
    expected_ekf_rate_hz: 20.0
    expected_vo_rate_hz: 12.0

    imu_min_rate_hz: 10.0
    imu_good_rate_hz: 15.0
    imu_excellent_rate_hz: 20.0
    wheel_odom_min_rate_hz: 10.0
    wheel_odom_good_rate_hz: 20.0
    wheel_odom_excellent_rate_hz: 25.0
    ekf_min_rate_hz: 10.0
    ekf_good_rate_hz: 15.0
    ekf_excellent_rate_hz: 20.0
    vo_min_rate_hz: 5.0
    vo_good_rate_hz: 8.0
    vo_excellent_rate_hz: 12.0
    rate_transition_debounce_s: 1.0
    # The 30-sample EKF window spans roughly 1-3 s near its 10 Hz minimum.
    # Require sustained low/recovered EKF evidence before changing readiness.
    ekf_rate_transition_debounce_s: 3.0

    max_imu_age_s: 0.5
    max_wheel_odom_age_s: 0.5
    max_filtered_odom_age_s: 0.5
    max_tf_age_s: 0.5

    max_odom_linear_speed_mps: 1.5
    max_odom_angular_speed_rad_s: 4.0

    log_warnings: true
